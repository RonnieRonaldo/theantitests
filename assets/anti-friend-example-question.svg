<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">THE ANTI-FRIEND QUIZ — sample question</title><desc id="desc">The group chat wants to meet. What do you bring? A: The stories. Possibly a dramatic entrance. B: Quiet loyalty. Eventually, a reply. C: A booking and three calendar reminders.</desc><rect width="1000" height="720" fill="#ff9d8e"/><rect x="18" y="18" width="964" height="684" fill="none" stroke="#171717" stroke-width="6"/><g fill="#171717" font-family="Arial,sans-serif"><text x="60" y="80" font-size="23" font-weight="bold">THE ANTI-FRIEND QUIZ</text><text x="60" y="168" font-size="43" font-weight="bold">The group chat wants to meet.</text><text x="60" y="226" font-size="43" font-weight="bold">What do you bring?</text><rect x="60" y="280" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="332" font-size="30" font-weight="bold">A</text><text x="138" y="331" font-size="27">The stories. Possibly a dramatic entrance.</text><rect x="60" y="385" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="437" font-size="30" font-weight="bold">B</text><text x="138" y="436" font-size="27">Quiet loyalty. Eventually, a reply.</text><rect x="60" y="490" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="542" font-size="30" font-weight="bold">C</text><text x="138" y="541" font-size="27">A booking and three calendar reminders.</text><text x="60" y="654" font-size="21">A TASTE OF THE QUIZ · THEANTITESTS.COM</text></g></svg>