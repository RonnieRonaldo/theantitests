<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><title>A sample question from the Anti-Love Quiz</title><desc>An ex sends Hey. Do you imagine a sequel, investigate it, or perform being unbothered?</desc><rect x="3" y="3" width="994" height="714" fill="#ff90b7" stroke="#171717" stroke-width="6"/><g fill="#171717" font-family="Arial,sans-serif"><text x="48" y="65" font-size="22" font-weight="700">THE ANTI-TESTS / LOVE &amp; LONGING</text><text x="48" y="139" font-size="46" font-weight="700">Months later, they text “Hey.”</text><text x="48" y="198" font-size="46" font-weight="700">Your imagination responds.</text><rect x="45" y="245" width="910" height="108" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="69" y="309" font-size="36" font-weight="700">A</text><text x="135" y="288" font-size="28" font-weight="700">A sequel. Obviously.</text><text x="135" y="325" font-size="27">The universe has renewed the series.</text><rect x="45" y="371" width="910" height="108" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="69" y="435" font-size="36" font-weight="700">B</text><text x="135" y="414" font-size="28" font-weight="700">Launch a full investigation.</text><text x="135" y="451" font-size="27">One word. Several possible motives.</text><rect x="45" y="497" width="910" height="108" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="69" y="561" font-size="36" font-weight="700">C</text><text x="135" y="540" font-size="28" font-weight="700">Act completely unbothered.</text><text x="135" y="577" font-size="27">Check whether it is working. Repeatedly.</text><text x="48" y="670" font-size="23" font-weight="700">8 QUESTIONS. 3 PROFILES. NO SOULMATE CERTIFICATE.</text></g></svg>