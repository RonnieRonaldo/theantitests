<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">THE ANTI-MOTIVATION TEST — sample question</title><desc id="desc">New day. New opportunities. Your response? A: Write three intentions. Reward yourself anyway. B: Open the laptop. Wait for urgency to find you. C: Make coffee. Let productivity wait.</desc><rect width="1000" height="720" fill="#b8ee77"/><rect x="18" y="18" width="964" height="684" fill="none" stroke="#171717" stroke-width="6"/><g fill="#171717" font-family="Arial,sans-serif"><text x="60" y="80" font-size="23" font-weight="bold">THE ANTI-MOTIVATION TEST</text><text x="60" y="168" font-size="43" font-weight="bold">New day. New opportunities.</text><text x="60" y="226" font-size="43" font-weight="bold">Your response?</text><rect x="60" y="280" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="332" font-size="30" font-weight="bold">A</text><text x="138" y="331" font-size="27">Write three intentions. Reward yourself anyway.</text><rect x="60" y="385" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="437" font-size="30" font-weight="bold">B</text><text x="138" y="436" font-size="27">Open the laptop. Wait for urgency to find you.</text><rect x="60" y="490" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="542" font-size="30" font-weight="bold">C</text><text x="138" y="541" font-size="27">Make coffee. Let productivity wait.</text><text x="60" y="654" font-size="21">A TASTE OF THE QUIZ · THEANTITESTS.COM</text></g></svg>