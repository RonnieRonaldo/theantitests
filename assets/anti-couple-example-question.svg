<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">THE ANTI-COUPLE QUIZ — sample question</title><desc id="desc">Your partner texts: Fine. Your first instinct? A: Ask if everything is okay. Immediately. B: Take a breath. Reply when calmer. C: Investigate the punctuation.</desc><rect width="1000" height="720" fill="#83dfb2"/><rect x="18" y="18" width="964" height="684" fill="none" stroke="#171717" stroke-width="6"/><g fill="#171717" font-family="Arial,sans-serif"><text x="60" y="80" font-size="23" font-weight="bold">THE ANTI-COUPLE QUIZ</text><text x="60" y="168" font-size="43" font-weight="bold">Your partner texts: Fine.</text><text x="60" y="226" font-size="43" font-weight="bold">Your first instinct?</text><rect x="60" y="280" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="332" font-size="30" font-weight="bold">A</text><text x="138" y="331" font-size="27">Ask if everything is okay. Immediately.</text><rect x="60" y="385" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="437" font-size="30" font-weight="bold">B</text><text x="138" y="436" font-size="27">Take a breath. Reply when calmer.</text><rect x="60" y="490" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="542" font-size="30" font-weight="bold">C</text><text x="138" y="541" font-size="27">Investigate the punctuation.</text><text x="60" y="654" font-size="21">A TASTE OF THE QUIZ · THEANTITESTS.COM</text></g></svg>