<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">THE ANTI-WORK QUIZ — sample question</title><desc id="desc">Another meeting at lunchtime. Your response? A: Offer to take the notes. Somehow. B: Send a colleague the perfect meme. C: Ask if an email would do.</desc><rect width="1000" height="720" fill="#ffd36b"/><rect x="18" y="18" width="964" height="684" fill="none" stroke="#171717" stroke-width="6"/><g fill="#171717" font-family="Arial,sans-serif"><text x="60" y="80" font-size="23" font-weight="bold">THE ANTI-WORK QUIZ</text><text x="60" y="168" font-size="43" font-weight="bold">Another meeting at lunchtime.</text><text x="60" y="226" font-size="43" font-weight="bold">Your response?</text><rect x="60" y="280" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="332" font-size="30" font-weight="bold">A</text><text x="138" y="331" font-size="27">Offer to take the notes. Somehow.</text><rect x="60" y="385" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="437" font-size="30" font-weight="bold">B</text><text x="138" y="436" font-size="27">Send a colleague the perfect meme.</text><rect x="60" y="490" width="880" height="83" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="82" y="542" font-size="30" font-weight="bold">C</text><text x="138" y="541" font-size="27">Ask if an email would do.</text><text x="60" y="654" font-size="21">A TASTE OF THE QUIZ · THEANTITESTS.COM</text></g></svg>