<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><title>A sample Anti-Perfectionism Quiz question</title><desc>Rewriting a message: seek another improvement, raise the standard, or keep the draft unfinished.</desc><rect x="3" y="3" width="994" height="714" fill="#e7d883" stroke="#171717" stroke-width="6"/><g fill="#171717" font-family="Arial,sans-serif"><text x="48" y="65" font-size="22" font-weight="700">THE ANTI-TESTS / PERFECTIONISM</text><text x="48" y="139" font-size="44" font-weight="700">The message is finished.</text><text x="48" y="198" font-size="44" font-weight="700">Why are you still rewriting it?</text><rect x="45" y="245" width="910" height="108" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="69" y="309" font-size="36" font-weight="700">A</text><text x="135" y="288" font-size="28" font-weight="700">One more edit might do it.</text><text x="135" y="325" font-size="27">The perfect version is surely next.</text><rect x="45" y="371" width="910" height="108" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="69" y="435" font-size="36" font-weight="700">B</text><text x="135" y="414" font-size="28" font-weight="700">The standard has moved again.</text><text x="135" y="451" font-size="27">Improvement reveals more to improve.</text><rect x="45" y="497" width="910" height="108" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="69" y="561" font-size="36" font-weight="700">C</text><text x="135" y="540" font-size="28" font-weight="700">A draft feels safer than a result.</text><text x="135" y="577" font-size="27">Nobody can judge what I never send.</text><text x="48" y="670" font-size="23" font-weight="700">15 QUESTIONS. 3 PROFILES. NO PERFECT ANSWERS REQUIRED.</text></g></svg>