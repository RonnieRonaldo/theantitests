<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><title>A sample Anti-Family Quiz question</title><desc>The family chat has 86 unread messages about pie. Add jokes, organise dessert, or reply and mute.</desc><rect x="3" y="3" width="994" height="714" fill="#ffbd79" stroke="#171717" stroke-width="6"/><g fill="#171717" font-family="Arial,sans-serif"><text x="48" y="65" font-size="22" font-weight="700">THE ANTI-TESTS / FAMILY CHAOS</text><text x="48" y="139" font-size="44" font-weight="700">86 unread family messages.</text><text x="48" y="198" font-size="44" font-weight="700">They are deciding who brings pie.</text><rect x="45" y="245" width="910" height="108" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="69" y="309" font-size="36" font-weight="700">A</text><text x="135" y="288" font-size="28" font-weight="700">Add a joke. Then three more.</text><text x="135" y="325" font-size="27">I am helping. The thread is now longer.</text><rect x="45" y="371" width="910" height="108" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="69" y="435" font-size="36" font-weight="700">B</text><text x="135" y="414" font-size="28" font-weight="700">Make an actual dessert plan.</text><text x="135" y="451" font-size="27">Apparently I run this family now.</text><rect x="45" y="497" width="910" height="108" fill="#faf9f3" stroke="#171717" stroke-width="3"/><text x="69" y="561" font-size="36" font-weight="700">C</text><text x="135" y="540" font-size="28" font-weight="700">Reply, then mute the chat.</text><text x="135" y="577" font-size="27">Love you all. In manageable doses.</text><text x="48" y="670" font-size="23" font-weight="700">15 QUESTIONS. 3 PROFILES. SAME RELATIVES, UNFORTUNATELY.</text></g></svg>